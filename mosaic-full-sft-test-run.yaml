name: axolotl-vision-test-run
image: mosaicml/pytorch:2.3.1_cu121-python3.11-ubuntu20.04
compute:
  gpus: 24
  cluster: r15z1p1
  gpu_type: h100_80gb
integrations:
- integration_type: git_repo
  git_repo: gophersquad-hackgt2018/360-LLaMA-Factory
  ssh_clone: true
  git_branch: sp
- integration_type: pip_packages
  packages:
  - wandb
command: |-
  unset WORLD_SIZE
  pip3 install awscli
  cd 360-LLaMA-Factory
  pip3 install ninja packaging
  pip3 install -e ".[torch,metrics,deepspeed,liger-kernel,bitsandbytes,flash-attn,auto-gptq]"
  pip3 install --no-deps ring-flash-attn
  wandb login
  huggingface-cli login --token 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
  accelerate launch --num_processes 24 --num_machines 3 --machine_rank $NODE_RANK --main_process_ip $MASTER_ADDR --main_process_port $MASTER_PORT src/train.py examples/train_full/llama3vision_full_sft_ds3.yaml